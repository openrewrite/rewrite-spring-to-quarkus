---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.quarkus.spring.SpringBootToQuarkus
displayName: Migrate Spring Boot to Quarkus
description: Replace Spring Boot with Quarkus.
tags:
  - spring
  - quarkus
  - migration
  - bom
recipeList:
  - org.openrewrite.quarkus.spring.MigrateSpringBootApplicationModules
  - org.openrewrite.quarkus.spring.UpgradeCiAndContainersToJava21

---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.quarkus.spring.MigrateSpringBootApplicationModules
displayName: Migrate Spring Boot application modules to Quarkus
description: Replace Spring Boot with Quarkus in the modules of Spring Boot 3 or 4 applications, and in the modules they depend on.
tags:
  - spring
  - quarkus
  - migration
preconditions:
  - org.openrewrite.java.dependencies.search.ModuleHasDependency:
      groupIdPattern: org.springframework.boot
      artifactIdPattern: spring-*
  - org.openrewrite.quarkus.spring.ModuleIsSpringBootApplication
recipeList:
  - org.openrewrite.maven.AddManagedDependency:
      groupId: io.quarkus.platform
      artifactId: quarkus-bom
      version: 4.x
      type: pom
      scope: import
      addToRootPom: false
  - org.openrewrite.gradle.AddPlatformDependency:
      groupId: io.quarkus.platform
      artifactId: quarkus-bom
      version: 4.x
  - org.openrewrite.gradle.plugins.ChangePlugin:
      pluginId: org.springframework.boot
      newPluginId: io.quarkus
      newVersion: 4.x
  - org.openrewrite.quarkus.spring.RemoveSpringDependencyManagementPlugin
  # Quarkus 4 requires Java 21; raise it while the Spring Boot parent still declares `java.version`
  - org.openrewrite.java.migrate.UpgradeBuildToJava21
  - org.openrewrite.java.migrate.UpgradePluginsForJava21
  - org.openrewrite.quarkus.spring.MigrateMavenPlugin
  - org.openrewrite.quarkus.spring.MigrateDatabaseDrivers
  - org.openrewrite.quarkus.spring.MigrateBootStarters
  # Quarkus 4 uses Jackson 3, which the Quarkus BOM manages alongside the Jackson 2 annotations
  - org.openrewrite.java.jackson.UpgradeJackson_2_3
  - org.openrewrite.quarkus.spring.SpringApplicationRunToQuarkusRun
  - org.openrewrite.quarkus.spring.ReplaceSpringBootApplication
  - org.openrewrite.quarkus.spring.EnableAnnotationsToQuarkusDependencies
  - org.openrewrite.quarkus.spring.AddSpringCompatibilityExtensions
  - org.openrewrite.quarkus.spring.ResponseEntityToJaxRsResponse
  - org.openrewrite.quarkus.spring.StereotypeAnnotationsToCDI
  - org.openrewrite.quarkus.spring.ValueToCdiConfigProperty
  - org.openrewrite.quarkus.spring.WebToJaxRs
  - org.openrewrite.quarkus.spring.RemoveSpringBootParent
  - org.openrewrite.quarkus.spring.MigrateSpringValidation
  - org.openrewrite.quarkus.spring.MigrateSpringActuator
  - org.openrewrite.quarkus.spring.MigrateSpringTesting
  - org.openrewrite.quarkus.spring.MigrateConfigurationProperties
  - org.openrewrite.quarkus.spring.MigrateSpringTransactional
  - org.openrewrite.quarkus.spring.MigrateSpringEvents
  - org.openrewrite.quarkus.spring.MigrateEntitiesToPanache
  - org.openrewrite.quarkus.spring.MigrateSpringDataMongodb
  - org.openrewrite.quarkus.spring.MigrateSpringCloudConfig
  #- org.openrewrite.quarkus.spring.ConfigureNativeBuild # Disabled until AddProfile is idempotent
  - org.openrewrite.quarkus.spring.MigrateRequestParameterEdgeCases
  - org.openrewrite.quarkus.spring.MigrateSpringCloudServiceDiscovery
  - org.openrewrite.quarkus.spring.MigrateSpringBootDevTools
  - org.openrewrite.quarkus.spring.CustomizeQuarkusVersion
  # Unlike Maven, Gradle dependencies added above carry an explicit version, which the Quarkus platform already manages
  - org.openrewrite.gradle.RemoveRedundantDependencyVersions:
      groupPattern: io.quarkus
  #- org.openrewrite.quarkus.spring.CustomizeQuarkusPluginGoals # Disabled until AddProfile is idempotent

---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.quarkus.spring.UpgradeCiAndContainersToJava21
displayName: Upgrade CI workflows and container images to Java 21
description: >-
  Quarkus 4 requires Java 21, so raise the `actions/setup-java` version in GitHub Actions workflows and the Java 17
  base images in Dockerfiles to 21. These files usually sit outside the application modules, so this runs on the
  whole repository once it contains a Spring Boot 3 or 4 application.
tags:
  - spring
  - quarkus
  - java21
  - docker
preconditions:
  - org.openrewrite.quarkus.spring.RepositoryHasSpringBootApplication
recipeList:
  - org.openrewrite.github.SetupJavaUpgradeJavaVersion:
      minimumJavaMajorVersion: 21
  - org.openrewrite.docker.ChangeFrom:
      oldImageName: eclipse-temurin
      oldTag: '17'
      newTag: '21'
  - org.openrewrite.docker.ChangeFrom:
      oldImageName: eclipse-temurin
      oldTag: 17-*
      newTag: 21-$1
  - org.openrewrite.docker.ChangeFrom:
      oldImageName: amazoncorretto
      oldTag: '17'
      newTag: '21'
  - org.openrewrite.docker.ChangeFrom:
      oldImageName: amazoncorretto
      oldTag: 17-*
      newTag: 21-$1
  - org.openrewrite.docker.ChangeFrom:
      oldImageName: bellsoft/liberica-*
      oldTag: '17'
      newTag: '21'
  - org.openrewrite.docker.ChangeFrom:
      oldImageName: bellsoft/liberica-*
      oldTag: 17-*
      newTag: 21-$1
  - org.openrewrite.docker.ChangeFrom:
      oldImageName: maven
      oldTag: '*-eclipse-temurin-17'
      newTag: $1-eclipse-temurin-21
  - org.openrewrite.docker.ChangeFrom:
      oldImageName: maven
      oldTag: '*-eclipse-temurin-17-*'
      newTag: $1-eclipse-temurin-21-$2
  - org.openrewrite.docker.ChangeFrom:
      oldImageName: maven
      oldTag: '*-amazoncorretto-17'
      newTag: $1-amazoncorretto-21
  - org.openrewrite.docker.ChangeFrom:
      oldImageName: maven
      oldTag: '*-amazoncorretto-17-*'
      newTag: $1-amazoncorretto-21-$2
  - org.openrewrite.docker.ChangeFrom:
      oldImageName: gradle
      oldTag: '*jdk17*'
      newTag: $1jdk21$2

---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.quarkus.spring.MigrateMavenPlugin
displayName: Add or replace Spring Boot build plugin with Quarkus build plugin
description: Remove Spring Boot Maven plugin if present and add Quarkus Maven plugin using the same version as the quarkus-bom.
tags:
  - spring
  - quarkus
  - migration
  - build
  - maven
recipeList:
  - org.openrewrite.maven.RemovePlugin:
      groupId: org.springframework.boot
      artifactId: spring-boot-maven-plugin
  - org.openrewrite.quarkus.spring.AddQuarkusMavenPlugin

---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.quarkus.spring.ReplaceSpringBootApplication
displayName: Replace `@SpringBootApplication` with Quarkus equivalent
description: Replace `@SpringBootApplication` with `@QuarkusMain` on the class that declares `main`, and `SpringApplication.run()` calls with `Quarkus.run()`.
preconditions:
  - org.openrewrite.java.search.FindTypes:
      fullyQualifiedTypeName: org.springframework.boot.autoconfigure.SpringBootApplication
recipeList:
  - org.openrewrite.quarkus.spring.SpringBootApplicationToQuarkusMain
  - org.openrewrite.quarkus.spring.SpringApplicationRunToQuarkusRun

---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.quarkus.spring.StereotypeAnnotationsToCDI
displayName: Migrate Spring annotations to CDI
description: Replace Spring stereotype and injection annotations with CDI equivalents.
recipeList:
  - org.openrewrite.quarkus.spring.SpringBeanToCdiProduces
  - org.openrewrite.quarkus.spring.SpringConfigurationToCdi
  - org.openrewrite.java.ReplaceAnnotation:
      annotationPatternToReplace: '@org.springframework.stereotype.Service'
      annotationTemplateToInsert: '@jakarta.enterprise.context.ApplicationScoped'
      classpathResourceName: 'jakarta.cdi-api-5'
  - org.openrewrite.java.ReplaceAnnotation:
      annotationPatternToReplace: '@org.springframework.stereotype.Component'
      annotationTemplateToInsert: '@jakarta.enterprise.context.ApplicationScoped'
      classpathResourceName: 'jakarta.cdi-api-5'
  - org.openrewrite.java.ReplaceAnnotation:
      annotationPatternToReplace: '@org.springframework.stereotype.Repository'
      annotationTemplateToInsert: '@jakarta.enterprise.context.ApplicationScoped'
      classpathResourceName: 'jakarta.cdi-api-5'
  - org.openrewrite.quarkus.spring.SpringAutowiredToInject
